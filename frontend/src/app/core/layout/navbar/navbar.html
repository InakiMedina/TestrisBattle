<div class="container">
  <h1>Tetris</h1>
  <div class="routers">
    <ul>
      <li>
        <a routerLink="/home/practice" routerLinkActive="active">
          <lucide-icon [img]="GamepadIcon" [size]="18"></lucide-icon>
          <span>Practice</span>
        </a>
      </li>
      <li>
        <a routerLink="/home/history" routerLinkActive="active">
          <lucide-icon [img]="CalendarIcon" [size]="18"></lucide-icon>
          <span>History</span>
        </a>
      </li>
      <li>
        <a routerLink="/home/profile" routerLinkActive="active">
          <lucide-icon [img]="UserIcon" [size]="18"></lucide-icon>
          <span>Profile</span>
        </a>
      </li>
    </ul>
  </div>
  <app-rank-game-button/>
</div>
