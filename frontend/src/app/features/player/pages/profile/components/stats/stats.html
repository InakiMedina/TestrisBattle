
<section class="stats-container">

  <h2>Tu historial de partidas:</h2>

  <div class="historial-header">
    <span>Enemigo</span>
    <span>Resultado</span>
    <span>Score</span>
    <span>Fecha</span>
    <span>Duración</span>
  </div>

  <div class="historial-lista">

    @for (partida of partidas; track $index) {

      <article
        class="partida-item"
        [class.ganada]="partida.resultado === 'Victoria'"
        [class.perdida]="partida.resultado === 'Derrota'"
      >

        <span class="partida-rival">
          {{ partida.nombreEnemigo }}
        </span>

        <span
          class="partida-resultado"
          [class.victoria]="partida.resultado === 'Victoria'"
          [class.derrota]="partida.resultado === 'Derrota'"
        >
          {{ partida.resultado | uppercase }}
        </span>

        <span class="partida-score">
          {{ partida.score }}
        </span>

        <span class="partida-fecha">
          {{ partida.fecha }}
        </span>

        <span class="partida-duracion">
          {{ partida.duracion }}
        </span>

      </article>

    }

  </div>

</section>
