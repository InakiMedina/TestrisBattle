@if (opponent()) {
  <div class="opponent-content">
    <div class="dice">
      <img src="/dice/1.png" alt="Dado del rival" />
    </div>
    <div class="random-power">
      <img src="/power/none.png" alt="Poder del rival" />
    </div>
  </div>
} @else {
  <div class="dice">
    <div
      class="dice-face"
      [class.ready]="canRoll()"
      [class.rolling]="animating()"
      role="img"
      aria-label="Resultado de tu dado"
    >
      @for (position of pipPositions; track position) {
        <span class="pip" [class.active]="hasPip(position)"></span>
      }
    </div>
  </div>
  <button
    class="dice-button"
    type="button"
    (click)="roll()"
    [class.ready]="canRoll()"
    [disabled]="animating() || !canRoll()"
  >
    {{ animating() ? 'Lanzando...' : 'Lanzar dado' }}
  </button>

  <div class="random-power">
    @if (selectedPower(); as power) {
      <img [src]="power.image" [alt]="power.name" />
    } @else {
      <span class="unknown-power" aria-label="Poder por descubrir">?</span>
    }
  </div>
}
